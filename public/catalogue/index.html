<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELIZ — The Art Catalogue 2022–2025</title>
<meta name="description" content="ELIZ — The Art Catalogue 2022–2025. Large abstract paintings by Elizaveta Zhuravleva.">
<style>
  :root { --dark:#100f0e; --text:#eceae6; --grey:#8e8a82; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--dark); overflow:hidden;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #book { width:100%; height:100%; }
  .page { background:var(--dark); }
  .page img { width:100%; height:100%; object-fit:contain; display:block;
    -webkit-user-drag:none; user-select:none; }
  .nav { position:fixed; top:50%; transform:translateY(-50%); z-index:10;
    width:44px; height:64px; border:none; background:transparent; cursor:pointer;
    color:var(--grey); font-size:26px; line-height:64px; opacity:.55; transition:opacity .2s,color .2s; }
  .nav:hover { opacity:1; color:var(--text); }
  #prev { left:6px; } #next { right:6px; }
  #hud { position:fixed; bottom:12px; left:0; right:0; text-align:center; z-index:10;
    color:var(--grey); font-size:11px; letter-spacing:.22em; opacity:.8; pointer-events:none; }
  #hint { position:fixed; bottom:32px; left:0; right:0; text-align:center; color:var(--grey);
    font-size:10px; letter-spacing:.2em; opacity:0; z-index:10; pointer-events:none;
    transition:opacity .6s; }
  @media (max-width:600px){ .nav{ display:none; } }
</style>
</head>
<body>
<div id="stage"><div id="book"></div></div>
<button class="nav" id="prev" aria-label="Previous page">‹</button>
<button class="nav" id="next" aria-label="Next page">›</button>
<div id="hint">SWIPE TO TURN THE PAGES</div>
<div id="hud">–</div>
<script src="page-flip.browser.js"></script>
<script>
(function(){
  var TOTAL = 60;
  var RATIO = 2200/2648;             // page w/h (actual jpg dimensions)
  var stage = document.getElementById('stage');
  var pages = [];
  for (var i=1;i<=TOTAL;i++) pages.push('pages/'+String(i).padStart(2,'0')+'.jpg');

  function fitSize(){
    // fall back to the stage element / documentElement when the window
    // hasn't reported real dimensions yet (e.g. first paint inside an iframe)
    var W = window.innerWidth || stage.clientWidth || document.documentElement.clientWidth || 800;
    var H = window.innerHeight || stage.clientHeight || document.documentElement.clientHeight || 600;
    var portrait = W < 600 || W < H*0.9;
    var ph = H - 56;                  // leave room for hud
    var pw = ph * RATIO;
    if (portrait){                    // single page fills width if needed
      if (pw > W-8){ pw = W-8; ph = pw/RATIO; }
    } else {                          // two pages side by side
      if (pw*2 > W-72){ pw = (W-72)/2; ph = pw/RATIO; }
    }
    return { w: Math.max(200, Math.floor(pw)), h: Math.max(200, Math.floor(ph)) };
  }

  var s = fitSize();
  var pageFlip = new St.PageFlip(document.getElementById('book'), {
    width: s.w, height: s.h,
    size: 'fixed',
    minWidth: 200, maxWidth: 4000, minHeight: 200, maxHeight: 4000,
    showCover: true,
    usePortrait: true,
    mobileScrollSupport: false,
    maxShadowOpacity: 0.45,
    flippingTime: 850,
    swipeDistance: 18
  });
  pageFlip.loadFromImages(pages);

  var hud = document.getElementById('hud');
  function updateHud(){
    var p = pageFlip.getCurrentPageIndex()+1;
    hud.textContent = 'ELIZ · THE ART CATALOGUE — ' + p + ' / ' + TOTAL;
  }
  pageFlip.on('flip', updateHud);
  pageFlip.on('init', updateHud);
  setTimeout(updateHud, 300);

  document.getElementById('prev').onclick = function(){ pageFlip.flipPrev(); };
  document.getElementById('next').onclick = function(){ pageFlip.flipNext(); };
  document.addEventListener('keydown', function(e){
    if (e.key==='ArrowRight'||e.key===' ') pageFlip.flipNext();
    if (e.key==='ArrowLeft') pageFlip.flipPrev();
  });

  var rt; window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){
      var s2 = fitSize();
      try { pageFlip.update({ width:s2.w, height:s2.h }); } catch(e){ location.reload(); }
    }, 250);
  });

  // one-time swipe hint on touch devices
  if ('ontouchstart' in window){
    var hint = document.getElementById('hint');
    setTimeout(function(){ hint.style.opacity = .9; }, 900);
    setTimeout(function(){ hint.style.opacity = 0; }, 3600);
  }
})();
</script>
</body>
</html>
